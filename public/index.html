<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Sports Tracker"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <title>Sports Tracker</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.svg"/>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<!-- ── ONBOARDING ─────────────────────────────────────────────────────────── -->
<div id="onboarding" style="display:none">
  <div class="ob-wrap">
    <div class="ob-logo">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#C9082A"/>
        <path d="M12 2v20M2 12h20M5.5 5.5c1.8 1.8 2.5 4.2 2.5 6.5s-.7 4.7-2.5 6.5M18.5 5.5C16.7 7.3 16 9.7 16 12s.7 4.7 2.5 6.5" stroke="white" stroke-width="1.2"/>
        <circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.2"/>
      </svg>
    </div>
    <h1 class="ob-title">Sports Tracker</h1>
    <p class="ob-sub">Follow your teams. Find out where to watch tonight.</p>

    <div class="ob-league-tabs">
      <button class="ob-league-btn active" id="ob-nba" onclick="obSetLeague('nba')">🏀 NBA</button>
      <button class="ob-league-btn" id="ob-mlb" onclick="obSetLeague('mlb')">⚾ MLB</button>
    </div>

    <p class="ob-hint">Tap your teams — pick as many as you want</p>
    <div class="ob-team-grid" id="obTeamGrid"></div>

    <div class="ob-footer">
      <div class="ob-selected-count" id="obCount">0 teams selected</div>
      <button class="ob-done-btn" id="obDoneBtn" onclick="finishOnboarding()">
        Get Started →
      </button>
    </div>
  </div>
</div>

<!-- ── MAIN APP ───────────────────────────────────────────────────────────── -->
<div id="app" style="display:none">

  <header class="top-bar">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#C9082A"/>
        <path d="M12 2v20M2 12h20M5.5 5.5c1.8 1.8 2.5 4.2 2.5 6.5s-.7 4.7-2.5 6.5M18.5 5.5C16.7 7.3 16 9.7 16 12s.7 4.7 2.5 6.5" stroke="white" stroke-width="1.2"/>
        <circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.2"/>
      </svg>
      Sports Tracker
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="refresh-countdown" id="refreshCountdown" style="display:none">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="7.5" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="7.5" stroke="#22c55e" stroke-width="1.5"
            stroke-dasharray="47.1" stroke-dashoffset="0"
            stroke-linecap="round" transform="rotate(-90 9 9)" id="cdRing"/>
        </svg>
        <span class="cd-time">2:00</span>
      </div>
      <div class="date-pill" id="datePill">—</div>
    </div>
  </header>

  <div class="league-switcher">
    <button class="league-btn active" id="league-nba" onclick="setLeague('nba')">🏀 NBA</button>
    <button class="league-btn" id="league-mlb" onclick="setLeague('mlb')">⚾ MLB</button>
  </div>

  <div class="scroll-body">
    <section class="section">
      <div class="section-head">
        <span class="section-title" id="teamSectionTitle">YOUR TEAMS</span>
        <button class="text-btn" id="editBtn" onclick="openEdit()">Edit</button>
      </div>
      <div class="followed-chips" id="followedChips"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <span class="section-title" id="gamesTitle">TONIGHT</span>
        <div class="tab-switcher" id="tabSwitcher" style="display:none">
          <button class="tab active" id="tab-my"  onclick="setTab('my')">My Teams</button>
          <button class="tab"        id="tab-all" onclick="setTab('all')">All</button>
        </div>
      </div>
      <div id="gamesContainer">
        <div class="loading-block"><div class="spinner"></div><span>Loading games…</span></div>
      </div>
    </section>
  </div>
  <div class="bottom-safe"></div>
</div>

<!-- ── EDIT TEAMS SHEET ───────────────────────────────────────────────────── -->
<div id="editSheet" style="display:none">
  <div class="sheet-backdrop" onclick="closeEdit()"></div>
  <div class="sheet-panel">
    <div class="sheet-header">
      <span class="sheet-title" id="sheetTitle">Edit Teams</span>
      <button class="sheet-done" onclick="closeEdit()">Done</button>
    </div>
    <div class="team-grid" id="teamGrid"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
